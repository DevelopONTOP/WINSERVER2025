name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      build_windows_client:
        description: 'Build Windows VIP Client'
        required: false
        default: 'true'
      build_admin_desktop:
        description: 'Build Native Desktop Admin'
        required: false
        default: 'true'

jobs:
  build_windows_client:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Add Windows platform to project
        working-directory: apps/windows
        run: flutter create --platforms=windows .

      - name: Verify MSVC compiler
        run: where cl.exe

      - name: Run flutter analyze
        run: flutter analyze --quiet

      - name: Build Windows VIP Client
        working-directory: apps/windows
        run: flutter build windows --release --dart-define=VIP_API_BASE_URL=https://cbaz.codegraf.ir/api/v1

      - name: Generate Inno Setup installer
        working-directory: apps/windows
        run: |
          if exist installer\vip_client.iss (
            iscc installer\vip_client.iss /DAppVersion=1.0.0
            echo "Installer generated successfully"
          ) else {
            echo "No Inno Setup script found"
          }

      - name: Upload Windows Client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vip-client-windows
          path: |
            apps/windows/build/windows/x64/runner
            apps/windows/build/windows/x64/entrypoint
            apps/windows/installer\VipClient.exe

  build_admin_desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"

      - name: Add Windows platform to project
        working-directory: admin-desktop
        run: flutter create --platforms=windows .

      - name: Verify MSVC compiler
        run: where cl.exe

      - name: Run flutter analyze
        run: flutter analyze --quiet admin-desktop

      - name: Build Native Windows Desktop Admin
        working-directory: admin-desktop
        run: flutter build windows --release --dart-define=VIP_API_BASE_URL=https://cbaz.codegraf.ir/api/v1

      - name: Generate Inno Setup installer (if applicable)
        working-directory: admin-desktop
        run: |
          if exist installer\vip_admin.iss (
            iscc installer\vip_admin.iss /DAppVersion=1.0.0
            echo "Installer generated successfully"
          ) else {
            echo "No Inno Setup script for admin desktop"
          )

      - name: Upload Desktop Admin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vip-admin-windows
          path: |
            admin-desktop/build/windows/x64/runner
            admin-desktop/build/windows/x64/entrypoint

  rdp-setup:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Server running..."
          }